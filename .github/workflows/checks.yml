name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python train.py --data_path examples/corpus.txt --max_iters 1 --batch_size 2 --block_size 8 --n_embd 16 --n_head 2 --n_layer 1 --eval_iters 1 --eval_interval 1 --warmup 0 --out smoke_model.pt
